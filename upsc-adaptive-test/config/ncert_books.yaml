# NCERT textbook registry for UPSC-relevant subjects, classes 6-12.
# English medium only (decided Sept 2026 - Hindi is in scope for
# current-affairs/RSS content, but not for NCERT). Codes reverse-
# engineered from the book-selector JS on https://ncert.nic.in/textbook.php
# (the "tbook" dropdown values).
#
# PDF URL pattern for chapter N of book code <code>:
#   https://ncert.nic.in/textbook/pdf/<code><NN>.pdf   (NN = 01, 02, ...)
#
# `chapters` is the known chapter count (download script stops early on
# a 404 regardless, so an overestimate is harmless).

books:
  # --- Class 6 ---
  - code: fees1
    title: "Exploring Society: India and Beyond (Class 6)"
    class: 6
    topics: [history, geography, polity, economy]
    chapters: 15

