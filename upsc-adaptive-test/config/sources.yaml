# Source registry for the UPSC adaptive test data pipeline.
# confidence: verified | unverified
#   verified   -> official govt/NCERT source, used as ground truth
#   unverified -> third-party/coaching compilation, used only as extra
#                 practice pool, never as sole source of truth

sources:
  - id: upsc_official
    name: UPSC official website
    url: https://upsc.gov.in
    type: [syllabus, question_paper, answer_key]
    confidence: verified
    notes: Prelims + Mains papers, official answer keys, syllabus PDFs.

  - id: ncert
    name: NCERT textbooks (classes 6-12)
    url: https://ncert.nic.in
    type: [reference_text]
    confidence: verified
    notes: History, Geography, Polity, Economy, Science base content.

  - id: pib
    name: Press Information Bureau
    url: https://pib.gov.in
    type: [current_affairs]
    confidence: verified
    ingestion: rss

  - id: prs_india
    name: PRS Legislative Research
    url: https://prsindia.org
    type: [current_affairs, policy_analysis]
    confidence: verified
    ingestion: scrape
    notes: >
      No RSS feed exists (checked /feed, /rss.xml, /rss, /feed.xml,
      /bill-track/rss - all 404). Scraped instead from the public
      /billtrack listing (975 bills, no pagination) via
      scripts/ingest/scrape_prs.py. robots.txt only disallows Drupal
      admin/system paths; /billtrack is unrestricted. Respects the
      site's Crawl-delay: 10. Only title/status/link stored, not PRS's
      own bill-summary text (copyright).

  - id: upsc_questions_compiled
    name: Uploaded UPSC_Questions.pdf (topic-wise compilation)
    local_path: data/raw/unverified/UPSC_Questions.pdf
    type: [question_paper]
    confidence: unverified
    coaching_origin: "Ganesh's IAS Study Centre (GIAS)"
    exception: >
      Watermark identifies this as coaching-institute material (GIAS),
      which config's excluded_sources policy would normally exclude.
      Explicit, one-off exception approved by the user (Sept 2026) for
      this specific file only - does not open the door to other
      coaching sources. Stays confidence=unverified; must still be
      cross-checked against upsc_official before being trusted as fact.
    notes: >
      248 MCQs across Polity/Economy/Geography/Environment/History,
      globally numbered 1-250 across topics (polity 1-50, economy
      51-100, geography 101-140, environment 141-200, history 201-250).
      Answers merged in from upsc_answer_key_orphan (Sept 2026) - see
      that entry for why the match is trustworthy. No year/source
      citation per question, so still bonus practice pool only, not
      promoted to verified.

  - id: upsc_answer_key_orphan
    name: Uploaded UPSC_Answer_Key.pdf
    local_path: data/raw/unverified/UPSC_Answer_Key.pdf
    type: [answer_key]
    confidence: unverified
    coaching_origin: "Ganesh's IAS Study Centre (GIAS)"
    exception: >
      Same one-off exception as upsc_questions_compiled - see above.
    notes: >
      250 answers. Merged into upsc_questions_compiled (Sept 2026):
      the key's 250-answer length exactly matches that question set's
      independently-derived global numbering span (1-250 across its 5
      topics) - a structural coincidence unlikely if the two files
      weren't originally paired. Spot-checked Q1's merged answer
      ("Economic Justice" -> Preamble + DPSP) against known fact; it's
      correct. One extraction glitch found and handled: position 143
      printed as "13.B" (dropped digit) - merge_answer_key.py matches
      by sequential position in the key, not the printed label, so
      this didn't cause a misalignment. Still confidence=unverified:
      matched by strong structural + spot-check evidence, not an
      official confirmation.

  - id: ssc_cgl_2024
    name: SSC CGL Tier 1 (Sept 2024)
    local_path: data/raw/unverified/SSC-CGL_2024.pdf
    type: [question_paper]
    confidence: excluded
    notes: Different exam (SSC, not UPSC). Excluded from ingestion by default.

excluded_sources:
  - Coaching material (Vision IAS, Drishti IAS, etc.) — copyright + no
    reliability guarantee. Not ingested.
    Exception: upsc_questions_compiled and upsc_answer_key_orphan
    (Ganesh's IAS / GIAS) were explicitly approved by the user as a
    one-off (Sept 2026) - see their per-source `exception` notes above.
    This does not generalize to other coaching sources.
