# RSS feeds for current-affairs ingestion.
# Only verified government / public-interest sources - no paywalled
# news reproduction (copyright). Store summary + link + tags, not full text.

feeds:
  - id: pib_delhi
    name: PIB - Delhi (national press releases)
    url: "https://pib.gov.in/RssMain.aspx?ModId=6&Lang=1&Regid=3"
    default_topic: current_affairs
    notes: >
      Confirmed working (verified by curl, Sept 2026). Despite Lang=1,
      items are frequently in Hindi (PIB's official feed mixes
      languages by release, independent of the Lang param - a known
      quirk, also noted by third-party PIB-RSS tools). Both languages
      are kept (app scope includes Hindi content) - fetch_rss.py tags
      each item's detected script (hindi/english) so the app can
      filter or route by language downstream if it needs to.
    reliability: flaky
    notes_reliability: >
      Connection resets on the TLS handshake roughly 1 in 3 attempts
      (server-side, not our proxy). fetch_rss.py retries with backoff.

# PRS India has no RSS feed (checked /feed, /rss.xml, /rss, /feed.xml,
# /bill-track/rss - all 404 as of Sept 2026). Bill-tracking content is
# scraped instead via scripts/ingest/scrape_prs.py - see sources.yaml.
